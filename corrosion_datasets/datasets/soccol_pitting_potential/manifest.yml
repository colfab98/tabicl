notes:
  - Raw files were copied without modification.
  - The workbook contains 4460 rows and 154 source identifiers; the paper describes approximately 4500 measurements from 155 studies.
  - The author manuscript confirms wt% composition, missing/unreported covariates, a common Ag/AgCl reference convention, and the event/censoring definition.
  - The source registry identifies mixed material families, incomplete composition representations, and one confirmed misfiled field in 2000Russell.
  - Benchmark v1 repairs the derived Russell Ti field, zero-fills composition with missingness indicators, and adds row-level material-family flags.
  - Split v1 follows the previous EPIT composition-separated 80/20 plus five-fold method; the unavailable test-method balance block is omitted by user decision.
  - No preprocessing or correction has been applied to the primary workbook; all derived files are under processed/.


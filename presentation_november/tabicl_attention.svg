<svg xmlns="http://www.w3.org/2000/svg" width="1144" height="440" viewBox="0 0 1144 440" role="img" aria-labelledby="title desc">
<title id="title">How TabICL uses attention</title><desc id="desc">Four stages: embed cell values, use attention within columns, combine features within rows, and predict query targets using labeled context.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#155568"/></marker></defs>
<rect x="0" y="6" width="268" height="418" rx="16" fill="#eaf2f4"/><circle cx="32" cy="39" r="17" fill="#155568"/><text x="32" y="45" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#fff">1</text><text x="134" y="83" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#155568">Cell embeddings</text>
<text x="134" y="367" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#233641">Turn each value</text>
<text x="134" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#233641">into a vector.</text>
<path d="M272 219 H287" stroke="#155568" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="292" y="6" width="268" height="418" rx="16" fill="#eaf2f4"/><circle cx="324" cy="39" r="17" fill="#155568"/><text x="324" y="45" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#fff">2</text><text x="426" y="83" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#155568">Column attention</text>
<text x="426" y="367" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#233641">Relate values within</text>
<text x="426" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#233641">the same feature.</text>
<path d="M564 219 H579" stroke="#155568" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="584" y="6" width="268" height="418" rx="16" fill="#eaf2f4"/><circle cx="616" cy="39" r="17" fill="#155568"/><text x="616" y="45" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#fff">3</text><text x="718" y="83" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#155568">Row attention</text>
<text x="718" y="367" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#233641">Combine features into</text>
<text x="718" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#233641">one sample representation.</text>
<path d="M856 219 H871" stroke="#155568" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="876" y="6" width="268" height="418" rx="16" fill="#eaf2f4"/><circle cx="908" cy="39" r="17" fill="#155568"/><text x="908" y="45" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#fff">4</text><text x="1010" y="83" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#155568">Labeled context</text>
<text x="1010" y="367" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#233641">Use labeled rows to predict</text>
<text x="1010" y="394" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#233641">targets for query rows.</text>
